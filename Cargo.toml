[package]
version = "1.0.5"
name = "libharu_ng"
description = "Easily generate PDFs from your Rust app."
authors = ["Bastian Bense <bb@neosw.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/bastibense/libharu_ng"
homepage = "https://github.com/bastibense/libharu_ng"
categories = [
  "external-ffi-bindings",
  "api-bindings",
  "pdf",
  "pdf-generation",
  "generator",
]

edition = "2021"
build = "build.rs"

exclude = [
  "*.code-workspace",
  ".github",
  ".gitignore",
  ".dockerignore",
  ".DS_Store",
  "Dockerfile",
]

[build-dependencies]
cmake = "0.1.50"
